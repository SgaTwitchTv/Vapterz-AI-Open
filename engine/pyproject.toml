[project]
name = "vapterz-open-engine"
version = "0.1.0"
description = "Offline raster vectorization and manual DXF layer export for Vapterz AI Open"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3,<2",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10,<12"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
vapterz-open = "vapterz_open.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vapterz_open*"]

